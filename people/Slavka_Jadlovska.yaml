pribeh: Narodila sa v roku 1988. Bakalárske, inžinierske aj doktorandské štúdium kybernetiky absolvovala na Fakulte elektrotechniky a informatiky Technickej univerzity v Košiciach. Pôsobí ako odborná asistentka na Katedre priemyselného inžinierstva a informatiky Fakulty výrobných technológií TUKE v Prešove a venuje sa modelovaniu a riadeniu dynamických systémov.
