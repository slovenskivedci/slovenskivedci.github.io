pribeh: Narodil sa v roku 1971. Magisterské štúdium fyziológie a genetiky rastlín absolvoval v roku 1995 na Univerzite Pavla Jozefa Šafárika v Košiciach. PhD. v botanike získal v roku 2003 v Ústave botaniky v Bratislave. Na Karlovej univerzite v Prahe pôsobí ako docent a vedúci kurátor herbárových zbierok a venuje sa evolučnej biológii rastlín, najmä polyploidii a apomixii.
