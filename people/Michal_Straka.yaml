pribeh: Magisterské štúdium absolvoval v roku 1996 na Prírodovedeckej fakulte Univerzity Komenského v Bratislave. PhD. získal na Helsinskej univerzite, kde sa v roku 2008 habilitoval. Pôsobí ako vedecký pracovník v Ústave organické chemie a biochemie AV ČR v Prahe a venuje sa teoretickej chémii, najmä molekulovým spínačom, endohedrálnym fullerénom a relativistickej NMR spektroskopii.
