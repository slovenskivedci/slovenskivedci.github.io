    <script>
    $(function(){
      function syncSearchClear(){
        var v = $("#header-search").val() || "";
        $("#header-search-clear").prop("hidden", v.length === 0);
      }
      $("#header-search").on("input", syncSearchClear);
      $("#header-search-clear").on("click", function(){
        $("#header-search").val("");
        syncSearchClear();
        $("#header-search").focus();
      });
      $("#header-search").on("keydown", function(e){
        if (e.key === "Enter") {
          e.preventDefault();
          var v = ($(this).val() || "").trim();
          window.location.href = v ? ("/?q=" + encodeURIComponent(v)) : "/";
        }
      });
    });
    </script>
