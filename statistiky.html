---
layout: lay-statistiky
title: Statistiky
---

<div role="list" class="w-dyn-items">





        <div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">
        <div class="row" align="center">
          <p style="margin:12px 0 4px;font-weight:600;font-size:16px;color:#111827;">Počet vedcov a vedkýň podľa krajiny pôsobenia</p>
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css" />
          <style>
#countryWorldMap { width: 100%; height: 260px; margin: 12px auto 0; }

.sv-chart { width: 100%; max-width: 920px; height: 260px; margin: 0 auto; }
.sv-chart-workplace { height: 420px; }
.sv-chart-donut { width: 220px; height: 220px; margin: 0 auto; }
.sv-chart-pair { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.sv-chart-pair .sv-chart { flex: 1 1 360px; max-width: 460px; }
@media (max-width: 700px) {
  .sv-chart { height: 200px; }
  .sv-chart-workplace { height: 420px; }
  #countryWorldMap { height: 200px !important; }
}

.country-map-legend { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 4px; font-size: 13px; color: #374151; }
.country-map-legend-bar { display: inline-block; width: 140px; height: 10px; border-radius: 999px; background: linear-gradient(to right, #bbf7d0, #14532d); }
</style>
          <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
          <div id="countryWorldMap"></div>
          <div class="country-map-legend" aria-hidden="true"><span>menej</span><span class="country-map-legend-bar"></span><span>viac</span></div>
          <script>
          (function () {
            var labels = {{ site.data.page.country }};
            var counts = {{ site.data.page.countryCount }};
            var skToIso = {"Slovensko": "SK", "USA": "US", "Spojené štáty": "US", "Česko": "CZ", "Česká republika": "CZ", "Rakúsko": "AT", "Kanada": "CA", "Austrália": "AU", "Nemecko": "DE", "Veľká Británia": "GB", "Spojené kráľovstvo": "GB", "Švajčiarsko": "CH", "Holandsko": "NL", "Francúzsko": "FR", "Nórsko": "NO", "Belgicko": "BE", "Belgium": "BE", "Katar": "QA", "Saudská Arábia": "SA", "Spojené arabské emiráty": "AE", "Švédsko": "SE", "Dánsko": "DK", "Fínsko": "FI", "Írsko": "IE", "Japonsko": "JP", "Ruská federácia": "RU", "Rusko": "RU", "Španielsko": "ES", "Taliansko": "IT", "Poľsko": "PL", "Maďarsko": "HU", "Portugalsko": "PT", "Grécko": "GR", "Rumunsko": "RO", "Bulharsko": "BG", "Chorvátsko": "HR", "Slovinsko": "SI", "Litva": "LT", "Lotyšsko": "LV", "Estónsko": "EE", "Ukrajina": "UA", "Bielorusko": "BY", "Čína": "CN", "India": "IN", "Brazília": "BR", "Mexiko": "MX", "Argentína": "AR", "Čile": "CL", "Južná Kórea": "KR", "Turecko": "TR", "Izrael": "IL", "Egypt": "EG", "Južná Afrika": "ZA", "Nový Zéland": "NZ", "Singapur": "SG", "Luxembursko": "LU", "Island": "IS", "Srbsko": "RS", "Malta": "MT", "Cyprus": "CY"};
            var isoToSk = {"SK": "Slovensko", "US": "Spojené štáty", "CZ": "Česká republika", "AT": "Rakúsko", "CA": "Kanada", "AU": "Austrália", "DE": "Nemecko", "GB": "Spojené kráľovstvo", "CH": "Švajčiarsko", "NL": "Holandsko", "FR": "Francúzsko", "NO": "Nórsko", "BE": "Belgicko", "QA": "Katar", "SA": "Saudská Arábia", "AE": "Spojené arabské emiráty", "SE": "Švédsko", "DK": "Dánsko", "FI": "Fínsko", "IE": "Írsko", "JP": "Japonsko", "RU": "Rusko", "ES": "Španielsko", "IT": "Taliansko", "PL": "Poľsko", "HU": "Maďarsko", "PT": "Portugalsko", "GR": "Grécko", "RO": "Rumunsko", "BG": "Bulharsko", "HR": "Chorvátsko", "SI": "Slovinsko", "LT": "Litva", "LV": "Lotyšsko", "EE": "Estónsko", "UA": "Ukrajina", "BY": "Bielorusko", "CN": "Čína", "IN": "India", "BR": "Brazília", "MX": "Mexiko", "AR": "Argentína", "CL": "Čile", "KR": "Južná Kórea", "TR": "Turecko", "IL": "Izrael", "EG": "Egypt", "ZA": "Južná Afrika", "NZ": "Nový Zéland", "SG": "Singapur", "LU": "Luxembursko", "IS": "Island", "RS": "Srbsko", "MT": "Malta", "CY": "Cyprus"};
            var urls = {{ site.data.page.countryUrl }};
            var realCounts = {};
            var isoNames = {};
            var isoToUrl = {};
            var scaleValues = {};
            var unmapped = [];
            for (var i = 0; i < labels.length; i++) {
              var iso = skToIso[labels[i]];
              var n = Number(counts[i]) || 0;
              if (!iso) { unmapped.push(labels[i]); continue; }
              realCounts[iso] = (realCounts[iso] || 0) + n;
              if (!isoNames[iso] || isoNames[iso] === "Belgium") isoNames[iso] = labels[i];
              if (!isoToUrl[iso] && urls[i]) isoToUrl[iso] = urls[i];
            }
            Object.keys(realCounts).forEach(function (iso) {
              scaleValues[iso] = Math.sqrt(realCounts[iso]);
            });
            if (unmapped.length) { console.warn("countryWorldMap unmapped", unmapped); }
            new jsVectorMap({
              selector: "#countryWorldMap",
              map: "world",
              backgroundColor: "transparent",
              zoomOnScroll: false,
              zoomButtons: true,
              regionStyle: { initial: { fill: "#e5e7eb" } },
              visualizeData: { scale: ["#bbf7d0", "#14532d"], values: scaleValues },
              onRegionTooltipShow: function (event, tooltip, code) {
                var name = (isoNames[code] || isoToSk[code] || tooltip.text());
                var count = realCounts[code] || 0;
                tooltip.text(name + ": " + count);
              },
              onRegionClick: function (event, code) {
                var curl = isoToUrl[code];
                if (!curl) return;
                window.location.href = '/?country=' + encodeURIComponent(curl);
              },
              onLoaded: function () {
                var root = document.getElementById('countryWorldMap');
                if (!root) return;
                Object.keys(realCounts).forEach(function (iso) {
                  var nodes = root.querySelectorAll('[data-code="' + iso + '"]');
                  for (var j = 0; j < nodes.length; j++) nodes[j].style.cursor = 'pointer';
                });
              }
            });
          })();
          </script>
        </div>
      </div>
    </div>

<div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">


        <div class="row" align="center">
           
          <div class="sv-chart-pair">
<div class="sv-chart"><canvas id="myChartHindex"></canvas></div>
		<script>
			const ctxmyChartHindex = document.getElementById('myChartHindex');
			 
			
			const dataHIndexHist = {
			  labels:{{ site.data.page.hindex_hist_x }} ,

				  label: 'Count',
				  data: {{ site.data.page.hindex_hist_count }},
				  borderColor: 'rgba(255, 99, 132, 0.2)',
				  backgroundColor: 'rgba(255, 99, 132, 1)',
				  borderWidth: 2,
				  borderRadius: 5,
				  borderSkipped: false,
				}
			  ]
			};
			
			const myChartHindex = new Chart(ctxmyChartHindex,
			    {
  type: 'bar',
  data: dataHIndexHist,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        position: 'top',
      },
      title: {
        display: true,
        text: 'Počet vedcov a vedkýň podľa h-indexu (histogram)'
      }
    }
  },
});
			</script> 
<div class="sv-chart"><canvas id="myChartYearHist"></canvas></div>

			const dataYearHist = {
			  labels:{{ site.data.page.year_hist_x }} ,

				{
				  label: 'Count',
				  data: {{ site.data.page.year_hist_count }},

				  backgroundColor: 'rgba(20, 184, 166, 1)',
				  borderWidth: 2,
				  borderRadius: 5,
				  borderSkipped: false,
				}
			  ]
			};
			
			const myChartYearHist = new Chart(ctxmyChartYearHist,
			    {
  type: 'bar',
  data: dataYearHist,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        position: 'top',
      },

        display: true,

</div>

        </div>
      </div>

<div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">

        <div class="row" align="center">
            <div class="sv-chart"><canvas id="myChartOdbor"></canvas></div>


 
			<script>
			const ctxOdbor = document.getElementById('myChartOdbor');
			const odborCounts = {{ site.data.page.odborCount }};
			const dataOdbor = {
			  labels:{{ site.data.page.odbor }} ,
			  datasets: [
				{
				  label: 'medián',
				  data: {{ site.data.page.odborMedian }},
				  borderColor: 'rgba(31, 78, 121, 0.25)',
				  backgroundColor: 'rgba(31, 78, 121, 0.85)',
				  borderWidth: 2,
				  borderRadius: 5,
				  borderSkipped: false,
				}
			  ]
			};
			const odborCountLabels = {
			  id: 'odborCountLabels',
			  afterDatasetsDraw: function(chart) {
			    var meta = chart.getDatasetMeta(0);
			    if (!meta || !meta.data) return;
			    var c = chart.ctx;
			    c.save();
			    c.fillStyle = '#666';
			    c.font = '12px Open Sans, sans-serif';
			    c.textAlign = 'center';
			    c.textBaseline = 'bottom';
			    meta.data.forEach(function(bar, i) {
			      if (!bar || odborCounts[i] == null) return;
			      c.fillText(String(odborCounts[i]), bar.x, bar.y - 3);
			    });
			    c.restore();
			  }
			};
			
			const myChartOdbor = new Chart(ctxOdbor,
			    {
  type: 'bar',
  data: dataOdbor,
  plugins: [odborCountLabels],
  options: {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 18 } },
    interaction: {
      mode: 'index',
      intersect: false
    },
    plugins: {
      legend: {
        display: true,
        position: 'top',
        align: 'center',
        labels: {
          boxWidth: 12,
          padding: 12
        }
      },
      tooltip: {
        mode: 'index',
        intersect: false,
        callbacks: {
          afterBody: function(items) {
            if (!items || !items.length) return '';
            var i = items[0].dataIndex;
            return 'počet: ' + odborCounts[i];
          }
        }
      },
      title: {
        display: true,
        text: 'H-index a počet podľa oblasti'
      }
    },
    scales: {
      x: {
        ticks: { maxRotation: 40, minRotation: 0, autoSkip: false }
      },
      y: {
        title: { display: true, text: 'medián h-index' },
        beginAtZero: true
      }
    }
  },
});
			</script>  

        <details class="odbor-key" style="max-width:900px;margin:18px auto 0;text-align:left;font-size:13px;line-height:1.45;color:#666;">
          <summary style="cursor:pointer;color:#666;">Zloženie oblastí</summary>
          <ul style="margin:8px 0 0;padding-left:1.2em;">
          {% for g in site.data.page.odbor_key %}
            <li style="margin:0 0 6px 0;"><strong>{{ g.area }}:</strong> {{ g.fields | join: ", " }}</li>
          {% endfor %}
          </ul>
        </details>

        </div>
      </div>
	</div>

<div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">

        <div class="row" align="center">
               
            <div class="sv-chart sv-chart-workplace"><canvas id="myChartCountByWorkplace"></canvas></div>


 
			<script>
			const ctxCountByWorkplace = document.getElementById('myChartCountByWorkplace');
			const labelsWpAll = {{ site.data.page.affiliation }};
			const countsWpAll = {{ site.data.page.affiliationCount }};
			const labelsWp = labelsWpAll.slice(0, 15);
			const countsWp = countsWpAll.slice(0, 15);
			if (countsWpAll.length > 15) {
			  var rest = 0;
			  for (var wi = 15; wi < countsWpAll.length; wi++) rest += Number(countsWpAll[wi]) || 0;
			  labelsWp.push('ostatné');
			  countsWp.push(rest);
			}
			const dataCountByWorkplace = {
			  labels: labelsWp,
			  datasets: [
				{
				  label: 'Count',
				  data: countsWp,
				  borderColor: 'rgba(180, 83, 9, 0.2)',
				  backgroundColor: 'rgba(217, 119, 6, 1)',
				  borderWidth: 2,
				  borderRadius: 5,
				  borderSkipped: false,
				}
			  ]
			};
			
			const myChartCountByWorkplace = new Chart(ctxCountByWorkplace,
			    {
  type: 'bar',
  data: dataCountByWorkplace,
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        position: 'top',
      },
      title: {
        display: true,
        text: 'Počet vedcov a vedkýň podľa pracoviska'
      }
    },
    scales: {
      x: { beginAtZero: true }
    }
  },
});
			</script>  


              
          <!--<img src="stats/affiliation.jpg"/>-->
        </div>
      </div>
	</div>

<div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">


        <div class="row" align="center">
           
          <div class="sv-chart"><canvas id="myChartYearHindex"></canvas></div>
		<script>
			const ctxmyChartYearHindex = document.getElementById('myChartYearHindex');
			 
			
			const dataYearHindex = {
			  datasets: [
				{
				  label: 'H-index',
				  data: {{ site.data.page.year_hindex_xy }},
				  borderColor: 'rgba(255, 159, 64, 0.2)',
				  backgroundColor: 'rgba(255, 159, 64, 1)',
				  borderWidth: 2,
				}
			  ]
			};
			
			const myChartYearHindex = new Chart(ctxmyChartYearHindex,
			    {
  type: 'scatter',
  data: dataYearHindex,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: {
        position: 'top',
      },
      title: {
        display: true,
        text: 'H-index podľa roku narodenia'
      },
      tooltip: {
        callbacks: {
          label: function(ctx) {
            var p = ctx.raw || {};
            var name = p.name || '';
            var year = p.x;
            var h = p.y;
            var parts = [];
            if (name) parts.push(name);
            if (h != null) parts.push('h ' + h);
            if (year != null) parts.push(String(year));
            return parts.join(' · ');
          }
        }
      }
    },
    onHover: function(evt, elements) {
      var t = evt && evt.native && evt.native.target;
      if (t) t.style.cursor = elements.length ? 'pointer' : 'default';
    },
    onClick: function(evt, elements, chart) {
      if (!elements || !elements.length) return;
      var el = elements[0];
      var p = chart.data.datasets[el.datasetIndex].data[el.index];
      if (!p || !p.id) return;
      window.location.href = '/#' + encodeURI(p.id);
    },
    scales: {
      x: {
        title: {
          display: true,
          text: 'rok narodenia'
        },
        ticks: {
          callback: function(value) { return String(Math.round(value)); }
        }
      },
      y: {
        title: {
          display: true,
          text: 'h-index'
        }
      }
    }
  },
});
			</script> 



        </div>
      </div>
	</div>
