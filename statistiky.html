<div role="list" class="w-dyn-items">





        <div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">
        <div class="row" align="center">
          <p style="margin:12px 0 4px;font-weight:600;font-size:16px;color:#111827;">Počet vedcov a vedkýň podľa krajiny pôsobenia</p>
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/css/jsvectormap.min.css" />
          <style>
#countryWorldMap { width: 100%; height: 420px; margin: 12px auto 0; }
.country-map-legend { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 4px; font-size: 13px; color: #374151; }
.country-map-legend-bar { display: inline-block; width: 140px; height: 10px; border-radius: 999px; background: linear-gradient(to right, #bbf7d0, #14532d); }
</style>
          <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/js/jsvectormap.min.js"></script>
          <script src="https://cdn.jsdelivr.net/npm/jsvectormap@1.5.3/dist/maps/world.js"></script>
          <div id="countryWorldMap"></div>
          <div class="country-map-legend" aria-hidden="true"><span>menej</span><span class="country-map-legend-bar"></span><span>viac</span></div>
          <script>
          (function () {
            var labels = {{ site.data.page.country }};
            var counts = {{ site.data.page.countryCount }};
            var skToIso = {"Slovensko": "SK", "USA": "US", "Spojené štáty": "US", "Česko": "CZ", "Česká republika": "CZ", "Rakúsko": "AT", "Kanada": "CA", "Austrália": "AU", "Nemecko": "DE", "Veľká Británia": "GB", "Spojené kráľovstvo": "GB", "Švajčiarsko": "CH", "Holandsko": "NL", "Francúzsko": "FR", "Nórsko": "NO", "Belgicko": "BE", "Belgium": "BE", "Katar": "QA", "Saudská Arábia": "SA", "Spojené arabské emiráty": "AE", "Švédsko": "SE", "Dánsko": "DK", "Fínsko": "FI", "Írsko": "IE", "Japonsko": "JP", "Ruská federácia": "RU", "Rusko": "RU", "Španielsko": "ES", "Taliansko": "IT", "Poľsko": "PL", "Maďarsko": "HU", "Portugalsko": "PT", "Grécko": "GR", "Rumunsko": "RO", "Bulharsko": "BG", "Chorvátsko": "HR", "Slovinsko": "SI", "Litva": "LT", "Lotyšsko": "LV", "Estónsko": "EE", "Ukrajina": "UA", "Bielorusko": "BY", "Čína": "CN", "India": "IN", "Brazília": "BR", "Mexiko": "MX", "Argentína": "AR", "Čile": "CL", "Južná Kórea": "KR", "Turecko": "TR", "Izrael": "IL", "Egypt": "EG", "Južná Afrika": "ZA", "Nový Zéland": "NZ", "Singapur": "SG", "Luxembursko": "LU", "Island": "IS", "Srbsko": "RS", "Malta": "MT", "Cyprus": "CY"};
            var isoToSk = {"SK": "Slovensko", "US": "Spojené štáty", "CZ": "Česká republika", "AT": "Rakúsko", "CA": "Kanada", "AU": "Austrália", "DE": "Nemecko", "GB": "Spojené kráľovstvo", "CH": "Švajčiarsko", "NL": "Holandsko", "FR": "Francúzsko", "NO": "Nórsko", "BE": "Belgicko", "QA": "Katar", "SA": "Saudská Arábia", "AE": "Spojené arabské emiráty", "SE": "Švédsko", "DK": "Dánsko", "FI": "Fínsko", "IE": "Írsko", "JP": "Japonsko", "RU": "Rusko", "ES": "Španielsko", "IT": "Taliansko", "PL": "Poľsko", "HU": "Maďarsko", "PT": "Portugalsko", "GR": "Grécko", "RO": "Rumunsko", "BG": "Bulharsko", "HR": "Chorvátsko", "SI": "Slovinsko", "LT": "Litva", "LV": "Lotyšsko", "EE": "Estónsko", "UA": "Ukrajina", "BY": "Bielorusko", "CN": "Čína", "IN": "India", "BR": "Brazília", "MX": "Mexiko", "AR": "Argentína", "CL": "Čile", "KR": "Južná Kórea", "TR": "Turecko", "IL": "Izrael", "EG": "Egypt", "ZA": "Južná Afrika", "NZ": "Nový Zéland", "SG": "Singapur", "LU": "Luxembursko", "IS": "Island", "RS": "Srbsko", "MT": "Malta", "CY": "Cyprus"};
            var realCounts = {};
            var isoNames = {};
            var scaleValues = {};
            var unmapped = [];
            for (var i = 0; i < labels.length; i++) {
              var iso = skToIso[labels[i]];
              var n = Number(counts[i]) || 0;
              if (!iso) { unmapped.push(labels[i]); continue; }
              realCounts[iso] = (realCounts[iso] || 0) + n;
              if (!isoNames[iso] || isoNames[iso] === "Belgium") isoNames[iso] = labels[i];
            }
            Object.keys(realCounts).forEach(function (iso) {
              scaleValues[iso] = Math.sqrt(realCounts[iso]);
            });
            if (unmapped.length) { console.warn("countryWorldMap unmapped", unmapped); }
            new jsVectorMap({
              selector: "#countryWorldMap",
              map: "world",
              backgroundColor: "transparent",
              zoomOnScroll: false,
              zoomButtons: true,
              regionStyle: { initial: { fill: "#e5e7eb" } },
              visualizeData: { scale: ["#bbf7d0", "#14532d"], values: scaleValues },
              onRegionTooltipShow: function (event, tooltip, code) {
                var name = (isoNames[code] || isoToSk[code] || tooltip.text());
                var count = realCounts[code] || 0;
                tooltip.text(name + ": " + count);
              }
            });
          })();
          </script>
        </div>
      </div>
    </div>

<div role="listitem" class="w-dyn-item">

<script>

  labels: {{ site.data.page.place }},

  ]
};

  type: "bar",
  data: dataPlace,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { display: true, position: "top" },
      title: { display: true, text: "H-index podľa pôsobiska: Slovensko vs zahraničie" },
      tooltip: { mode: "index", intersect: false }
    },
    scales: {
      y: { title: { display: true, text: "h-index" }, beginAtZero: true }
    }
  }
});

</script>
