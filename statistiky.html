---
layout: lay-statistiky
title: Statistiky
---

<div role="list" class="w-dyn-items">





    <div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">


        <div class="row" align="center">
           
          <canvas id="myChartHindex" width="400" height="400"></canvas>
		<script>
			const ctxmyChartHindex = document.getElementById('myChartHindex');
			 
			
			const dataHIndexHist = {
			  labels:{{ site.data.page.hindex_hist_x }} ,
			  datasets: [
				{
				  label: 'Count',
				  data: {{ site.data.page.hindex_hist_count }},
				  borderColor: 'rgba(255, 99, 132, 0.2)',
				  backgroundColor: 'rgba(255, 99, 132, 1)',
				  borderWidth: 2,
				  borderRadius: 5,
				  borderSkipped: false,
				}
			  ]
			};
			
			const myChartHindex = new Chart(ctxmyChartHindex,
			    {
  type: 'bar',
  data: dataHIndexHist,
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'top',
      },
      title: {
        display: true,
        text: 'Počet vedcov a vedkýň podľa h-indexu (histogram)'
      }
    }
  },
});
			</script> 



          <!--<img  src="stats/hindex.jpg"/>-->
        </div>
      </div>
	</div>






      <div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">

          <!--<img  src="stats/year.jpg"/>-->
        </div>

    <div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">


        <div class="row" align="center">
           
          <canvas id="myChartYearHindex" width="400" height="400"></canvas>
		<script>
			const ctxmyChartYearHindex = document.getElementById('myChartYearHindex');
			 
			
			const dataYearHindex = {
			  datasets: [
				{
				  label: 'H-index',
				  data: {{ site.data.page.year_hindex_xy }},
				  borderColor: 'rgba(255, 159, 64, 0.2)',
				  backgroundColor: 'rgba(255, 159, 64, 1)',
				  borderWidth: 2,
				}
			  ]
			};
			
			const myChartYearHindex = new Chart(ctxmyChartYearHindex,
			    {
  type: 'scatter',
  data: dataYearHindex,
  options: {
    responsive: true,
    plugins: {
      legend: {
        position: 'top',
      },
      title: {
        display: true,
        text: 'H-index podľa roku narodenia'
      }
    },
    scales: {
      x: {
        title: {
          display: true,
          text: 'rok narodenia'
        },
        ticks: {
          callback: function(value) { return String(Math.round(value)); }
        }
      },
      y: {
        title: {
          display: true,
          text: 'h-index'
        }
      }
    }
  },
});
			</script> 



        </div>
      </div>
	</div>



    <div role="listitem" class="w-dyn-item">
      <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">

        <div class="row" align="center">
            <div style="width:100%;height:420px;"><canvas id="myChartOdbor"></canvas></div>


 
			<script>
			const ctxOdbor = document.getElementById('myChartOdbor');
			const dataOdbor = {
			  labels:{{ site.data.page.odbor }} ,
			  datasets: [
				{
				  label: 'minimum',
				  data: {{ site.data.page.odborMin }},
				  borderColor: 'rgba(147, 197, 253, 0.8)',
				  backgroundColor: 'rgba(147, 197, 253, 1)',
				  borderWidth: 2,
				  borderRadius: 5,
				  borderSkipped: false,
				},
				{
				  label: 'priemer',
				  data: {{ site.data.page.odborAvg }},
				  borderColor: 'rgba(59, 130, 246, 0.8)',
				  backgroundColor: 'rgba(59, 130, 246, 1)',
				  borderWidth: 2,
				  borderRadius: 5,
				  borderSkipped: false,
				},
				{
				  label: 'maximum',
				  data: {{ site.data.page.odborMax }},
				  borderColor: 'rgba(30, 64, 175, 0.8)',
				  backgroundColor: 'rgba(30, 64, 175, 1)',
				  borderWidth: 2,
				  borderRadius: 5,
				  borderSkipped: false,
				}
			  ]
			};
			
			const myChartOdbor = new Chart(ctxOdbor,
			    {
  type: 'bar',
  data: dataOdbor,
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: {
      mode: 'index',
      intersect: false
    },
    plugins: {
      legend: {
        display: true,
        position: 'top',
        align: 'center',
        labels: {
          boxWidth: 12,
          padding: 12
        }
      },
      tooltip: {
        mode: 'index',
        intersect: false
      },
      title: {
        display: true,
        text: 'H-index podľa oblasti'
      }
    },
    scales: {
      x: {
        ticks: { maxRotation: 40, minRotation: 0, autoSkip: false }
      },
      y: {
        title: { display: true, text: 'h-index' },
        beginAtZero: true
      }
    }
  },
});
			</script>  

        <div class="odbor-key" style="max-width:900px;margin:18px auto 0;text-align:left;font-size:14px;line-height:1.45;">
          <p style="margin:0 0 8px 0;"><strong>Zloženie oblastí</strong> (konkrétne odbory z profilov):</p>
          <ul style="margin:0;padding-left:1.2em;">
          {% for g in site.data.page.odbor_key %}
            <li style="margin:0 0 6px 0;"><strong>{{ g.area }}:</strong> {{ g.fields | join: ", " }}</li>
          {% endfor %}
          </ul>
        </div>

        </div>
      </div>
	</div>



    <div role="listitem" class="w-dyn-item">

      },
      y: {

        }
      }
    }
  },
});
			</script> 



        </div>
      </div>
	</div>



<div role="listitem" class="w-dyn-item">
    <div class="post-wrapper" style="opacity: 1; transform: translate3d(0px, 0px, 0px) scale3d(1, 1, 1) rotateX(0deg) rotateY(0deg) rotateZ(0deg) skew(0deg, 0deg); transform-style: preserve-3d;">

				label: '# count',

					'rgba(255, 99, 132, 1)',

				borderWidth: 1
			}]
		},
		options: {
			scales: {

					beginAtZero: true

			}
		}
	});
	</script>
