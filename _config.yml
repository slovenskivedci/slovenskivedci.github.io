# Jekyll config for https://www.slovenskivedci.sk (GitHub Pages, branch gh-pages).
# The site uses its own layouts in _layouts/ (lay-*.html); no theme and no feed.

title: Slovenskí vedci
description: >-
  Slovenskí vedci a vedkyne s vysokým Hirschovým indexom.
lang: sk
baseurl: ""
url: "https://www.slovenskivedci.sk"

# No theme (the old minima theme pulled in jekyll-feed and its own header).
plugins: []

# Not published. Folders starting with "_" (e.g. _people_held/, _tmp_photos/)
# are never published by Jekyll anyway; _people_held is listed for safety.
exclude:
  - README.md
  - template.style
  - _people_held
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
