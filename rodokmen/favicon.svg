<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    svg{--bg:#F3F5F8;--card:#FFFFFF;--ink:#4A5469;--blue:#2C4ECE}
    @media (prefers-color-scheme:dark){
      svg{--bg:#111724;--card:#161E2E;--ink:#A8B0C3;--blue:#7EA3FF}
    }
  </style>
  <!-- tab/chrome ground -->
  <rect width="32" height="32" rx="7" fill="var(--bg)"/>
  <!-- soft card (matches banner rounded square) -->
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="6.25" fill="var(--card)" stroke="var(--ink)" stroke-opacity=".18" stroke-width="1"/>
  <!-- genealogy fork: solid node → two outlined children -->
  <g fill="none" stroke="var(--ink)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21.2 16 L11.6 9.4"/>
    <path d="M21.2 16 L11.6 22.6"/>
  </g>
  <circle cx="10.4" cy="8.8" r="3.55" fill="var(--card)" stroke="var(--ink)" stroke-width="1.75"/>
  <circle cx="10.4" cy="23.2" r="3.55" fill="var(--card)" stroke="var(--ink)" stroke-width="1.75"/>
  <circle cx="22.4" cy="16" r="4.05" fill="var(--blue)"/>
</svg>
